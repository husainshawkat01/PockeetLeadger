<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PocketLedger — Sign In</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon">💰</div>
      <h1>PocketLedger</h1>
      <p>Your private finance companion</p>
    </div>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input
          type="email" id="login-email"
          placeholder="you@example.com"
          autocomplete="email" required
        />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input
          type="password" id="login-password"
          placeholder="••••••••"
          autocomplete="current-password" required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="login-btn" style="margin-top:0.5rem">
        Sign In
      </button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:var(--text-muted)">
      Private &amp; secure · Single-user access only
    </p>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>initLogin();</script>
</body>
</html>
